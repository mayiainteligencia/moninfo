  <text x="122" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="300" letter-spacing="-0.01em" fill="#4ade80">ESCUCHA</text>
  <circle cx="236" cy="27" r="3" fill="#22c55e" />
